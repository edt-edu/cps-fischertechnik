
default:
  image: maven:3.9.14-eclipse-temurin-21-alpine
  tags:
    - ci.inria.fr
    - small
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  MAVEN_CLI_OPTS: >-
    -s ci_settings.xml
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --no-transfer-progress
    -DinstallAtEnd=true
    -DdeployAtEnd=true
    -D"checkstyle.skip"

  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Djava.awt.headless=true -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dmaven.wagon.http.ssl.ignore.validity.dates=true'


test_and_package:
  stage: build
  tags:
    - ci.inria.fr
    - medium
  rules:
    #- if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    #  when: never
    - if: $CI_COMMIT_TAG
    #  when: never
    #- if: $CI_COMMIT_BRANCH != "main"
    - if: $CI_COMMIT_BRANCH
  script:
    - apk add --update nodejs npm
    - mvn $CI_MAVEN_OPTS $MAVEN_CLI_OPTS
      clean verify
      fr.jcgay.maven.plugins:buildplan-maven-plugin:list-phase
    - echo "Code coverage:"
    - cat sysml-mission-generator/target/site/jacoco/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>//' || true
  artifacts:
    when: always
    reports:
      junit:
        - sysml-mission-generator/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: sysml-mission-generator/target/site/jacoco/jacoco.xml
    paths:
      - sysml-mission-generator/target/*.jar- sysml
      - mission-generator/target/site/jacoco/ # allow to look at the HTML report
  coverage: '/Total.*?([0-9]{1,3})%/'