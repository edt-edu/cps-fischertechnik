
# Configuration for VacuumGripperController
---
plc:
  id: "LocalDevPLC"
connection:
  # if host is commented, will default to "<hostname>.local"
  host: "localhost"
  # host: "RevPi103156.local"
  command_port: 6001
  notification_port: 6011
  # connectionListening: "controller" or "orchestrator"
  connectionListening: "controller"

controller:
  mainLoopDelay: 0.25

mqtt:
  # empty server in order to not send any MQTT message, useful to decrease error message in test suites
  server: 
  port: 1883
  keepalive: 60

