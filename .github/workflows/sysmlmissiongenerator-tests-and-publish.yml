name: SysML Mission Generator tests and publish

on:
  push:
    paths:
      - ".github/workflows/sysmlmissiongenerator-tests-and-publish.yml"
      - "sysml-mission-generator/**"

  pull_request:
    paths:
      - ".github/workflows/sysmlmissiongenerator-tests-and-publish.yml"
      - "sysml-mission-generator/**"

concurrency:
  group: sysmlmissiongenerator-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  packages: write
  
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MAVEN_CLI_OPTS: >-
    -s ci_settings.xml
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --no-transfer-progress
    -DinstallAtEnd=false
    -DdeployAtEnd=true
    -Dcheckstyle.skip
  
jobs:
  test:
    name: Test SysML Mission Generator
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sysml-mission-generator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn $MAVEN_CLI_OPTS --update-snapshots install

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: SysML Mission Generator tests
          path: sysml-mission-generator/**/target/**/TEST-*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          collapsed: always

      - name: Generate coverage reports
        if: always()
        run: |
          python3 ${{ github.workspace }}/.github/scripts/jacoco-summary.py

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: "sysml-mission-generator/**/target/site/jacoco/**"
          if-no-files-found: warn
          retention-days: 14    
      # - name: Upload backend JAR
      #   if: ${{ !cancelled() }}
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: sysml-mission-generator
      #     path: sysml-mission-generator/**/target/*.jar

  publish:
    name: Publish SysML Mission Generator
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: sysml-mission-generator

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            sysml-mission-generator/**/pom.xml
          server-id: github

      - name: Publish Maven modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn \
            -s ci_settings.xml \
            --batch-mode \
            --errors \
            --no-transfer-progress \
            -DskipTests \
            -Dinvoker.skip=true \
            deploy

      # remove old snapshots from GitHub Packages
      - name: Cleanup sysml-mission-generator root
        uses: ./.github/actions/cleanup-maven-snapshots
        with:
          package-name: fr.inria.mbdo.mission.sysml-mission-generator-root

      - name: Cleanup sysml-mission-generator runtime
        uses: ./.github/actions/cleanup-maven-snapshots
        with:
          package-name: fr.inria.mbdo.mission.sysml-mission-runtime

      - name: Cleanup sysml-mission-generator core
        uses: ./.github/actions/cleanup-maven-snapshots
        with:
          package-name: fr.inria.mbdo.mission.sysml-mission-generator

      - name: Cleanup sysml-mission-generator cli
        uses: ./.github/actions/cleanup-maven-snapshots
        with:
          package-name: fr.inria.mbdo.mission.sysml-mission-generator-cli

      - name: Cleanup sysml-mission-generator maven-plugin
        uses: ./.github/actions/cleanup-maven-snapshots
        with:
          package-name: fr.inria.mbdo.mission.sysml-mission-generator-maven-plugin

      - name: Cleanup sysml-mission-generator gradle-plugin
        uses: ./.github/actions/cleanup-maven-snapshots
        with:
          package-name: fr.inria.mbdo.mission.sysml-mission-generator-gradle-plugin                    