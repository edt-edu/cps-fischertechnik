# this workflow is used to test the rppm-controller on a pull request and on push to the main branch
name: rppm-controller-test
on:
  push:
    paths:
        - ".github/workflows/rppmcontroller-tests.yml"
        - "rppmcontroller/**"
  pull_request:
    paths:
      - ".github/workflows/rppmcontroller-tests.yml"
      - "rppmcontroller/**"
permissions:
  contents: read
  code-quality: write

jobs:
  test:
    name: RPPM Controller tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rppmcontroller
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: rppmcontroller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTEST_ADDOPTS: "--color=yes"
        run: |
          echo "Executing unit tests..."
          coverage run -m pytest -rsv --junit-xml=report.xml

      - name: Generate coverage reports
        if: always()
        run: |
          coverage report
          coverage xml

      # GitHub native code coverage
      - name: Upload coverage to GitHub
        if: success()
        uses: actions/upload-code-coverage@v1
        with:
          file: rppmcontroller/coverage.xml
          language: Python
          label: code-coverage/rppmcontroller

      # Keep raw reports, equivalent to GitLab artifacts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rppmcontroller-test-reports
          path: |
            rppmcontroller/report.xml
            rppmcontroller/coverage.xml