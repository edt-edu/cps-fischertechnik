

<!-- Parameters -->
<div class="form-group " [formGroup]="parametersForm">
  <div class="flex justify-content-evenly flex-wrap">

    @if (! (title === undefined)) {
      <div class="form-group  flex-grow-1" formGroupName="rotationGroup">
        <label>{{ title }}</label>
      </div>
    }

    <div class="form-group  flex-grow-1" formGroupName="rotationGroup">
      <label>Rotation</label>
      <p-inputNumber
        formControlName="rotation"
        inputId="minmax"
        mode="decimal"
        (onInput)="emitValues()"
        [min]="0"
        [showButtons]="true"
        [step]="5" />
    </div>
    <div class="form-group   flex-grow-1"  formGroupName="verticalGroup">
      <label>Vertical</label>
      <p-inputNumber
        formControlName="vertical"
        inputId="minmax"
        mode="decimal"
        (onInput)="emitValues()"
        [min]="0"
        [showButtons]="true"
        [step]="5" />
    </div>
    <div class="form-group   flex-grow-1"  formGroupName="horizontalGroup">
      <label>Horizontal</label>
      <p-inputNumber
        formControlName="horizontal"
        inputId="minmax"
        mode="decimal"
        (onInput)="emitValues()"
        [min]="0"
        [showButtons]="true"
        [step]="5" />
    </div>
  </div>
</div>
