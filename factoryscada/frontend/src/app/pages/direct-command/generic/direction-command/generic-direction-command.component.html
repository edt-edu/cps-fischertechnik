
<p-fieldset legend="{{ machine?.name }} - {{ title }}">

  <p>{{ description }}</p>

  <!-- Parameters -->
  <div class="form-group flex-grow-1">
    <label>Direction</label>
    <p-dropdown 
      [options]="directions"
      optionLabel="name" 
      [(ngModel)]="selectedDirection"/>
  </div>

  <!-- Action Buttons -->
  <div class="">
    <p-button label="Execute" (click)="onExecute()" ></p-button>
  </div>
</p-fieldset>
